# Configuração Base do Redis Sentinel
port 26379
dir /tmp

# Monitora o IP fixo da instância primária (172.28.0.10) com quórum de 2
sentinel monitor mymaster 172.28.0.10 6379 2

# Considera o master inativo se não responder em 3 segundos (3000ms)
sentinel down-after-milliseconds mymaster 3000

# Tempo máximo para concluir um failover (60 segundos)
sentinel failover-timeout mymaster 60000

# Quantas réplicas podem se resincronizar com o novo master simultaneamente
sentinel parallel-syncs mymaster 1
